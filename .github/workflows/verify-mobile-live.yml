name: Verify Southernmost mobile visibility live

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/verify-mobile-live.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-mobile:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for final public assets
        shell: bash
        run: |
          set -euo pipefail
          url="https://guardian-prodigy.github.io/southernmost-bar-grille/?v=20260725h&verify=1"
          for attempt in $(seq 1 48); do
            echo "Public deployment attempt ${attempt}/48"
            if curl -fsSL --connect-timeout 15 --max-time 60 "$url" -o /tmp/live.html \
              && grep -q "hotfix.css?v=20260725h" /tmp/live.html \
              && grep -q "hotfix.js?v=20260725h" /tmp/live.html; then
              echo "Final hotfix assets are public."
              exit 0
            fi
            sleep 10
          done
          echo "Final public assets were not published in time."
          head -c 1200 /tmp/live.html || true
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Chromium test runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run mobile browser verification
        shell: bash
        run: |
          cat > /tmp/verify-mobile.mjs <<'EOF'
          import { chromium, devices } from 'playwright';
          import fs from 'node:fs';

          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({
            ...devices['Pixel 7'],
            locale: 'en-US',
            colorScheme: 'dark',
          });
          const page = await context.newPage();
          const errors = [];
          page.on('pageerror', (error) => errors.push(`pageerror: ${error.message}`));
          page.on('console', (message) => {
            if (message.type() === 'error') errors.push(`console: ${message.text()}`);
          });

          const url = 'https://guardian-prodigy.github.io/southernmost-bar-grille/?v=20260725h&verify=1';
          await page.goto(url, { waitUntil: 'networkidle', timeout: 120000 });
          await page.waitForTimeout(1200);

          const initial = await page.evaluate(() => {
            const style = (selector) => {
              const node = document.querySelector(selector);
              if (!node) return null;
              const computed = getComputedStyle(node);
              return {
                hidden: node.hidden,
                display: computed.display,
                visibility: computed.visibility,
                opacity: Number(computed.opacity || 0),
                filter: computed.filter,
                backdropFilter: computed.backdropFilter || computed.webkitBackdropFilter || 'none',
                transform: computed.transform,
                pointerEvents: computed.pointerEvents,
              };
            };
            return {
              bodyClasses: document.body.className,
              guideBackdrop: style('#guide-backdrop'),
              drawerBackdrop: style('#drawer-backdrop'),
              modal: style('#flow-modal'),
              heroCopy: style('.hero__copy'),
              mobileBar: style('.mobile-action-bar'),
              uiReady: document.documentElement.classList.contains('southernmost-ui-ready'),
              viewport: { width: innerWidth, height: innerHeight },
            };
          });

          const assert = (condition, message) => {
            if (!condition) throw new Error(message);
          };

          assert(initial.uiReady, 'Hotfix did not mark the UI ready.');
          assert(!initial.bodyClasses.includes('no-scroll'), 'Body remained locked on initial load.');
          for (const [name, layer] of [['guide', initial.guideBackdrop], ['drawer', initial.drawerBackdrop], ['modal', initial.modal]]) {
            assert(layer, `${name} layer is missing.`);
            assert(layer.hidden || layer.display === 'none' || (layer.visibility === 'hidden' && layer.pointerEvents === 'none'), `${name} layer is unexpectedly active: ${JSON.stringify(layer)}`);
            assert(layer.backdropFilter === 'none', `${name} layer is blurring the page while closed: ${JSON.stringify(layer)}`);
          }
          assert(initial.heroCopy && initial.heroCopy.opacity >= 0.99 && initial.heroCopy.visibility === 'visible', `Hero content is not visible: ${JSON.stringify(initial.heroCopy)}`);
          assert(initial.heroCopy.filter === 'none', `Hero content is filtered: ${JSON.stringify(initial.heroCopy)}`);
          assert(initial.mobileBar && initial.mobileBar.opacity >= 0.99 && initial.mobileBar.visibility === 'visible', `Mobile dock is not stable: ${JSON.stringify(initial.mobileBar)}`);

          await page.screenshot({ path: '/tmp/southernmost-mobile-fixed.png', fullPage: true });

          await page.locator('[data-open-guide]').last().click();
          await page.waitForTimeout(450);
          const guideOpen = await page.evaluate(() => ({
            panel: document.querySelector('#guide-panel')?.classList.contains('is-open'),
            backdrop: document.querySelector('#guide-backdrop')?.classList.contains('is-open'),
            hidden: document.querySelector('#guide-backdrop')?.hidden,
          }));
          assert(guideOpen.panel && guideOpen.backdrop && guideOpen.hidden === false, `Guide did not open correctly: ${JSON.stringify(guideOpen)}`);
          await page.locator('[data-close-guide]').click();
          await page.waitForTimeout(400);
          assert(await page.locator('#guide-backdrop').evaluate((node) => node.hidden), 'Guide backdrop did not close cleanly.');

          await page.locator('[data-open-cart]').last().click();
          await page.waitForTimeout(450);
          const cartOpen = await page.evaluate(() => ({
            drawer: document.querySelector('#cart-drawer')?.classList.contains('is-open'),
            backdrop: document.querySelector('#drawer-backdrop')?.classList.contains('is-open'),
            hidden: document.querySelector('#drawer-backdrop')?.hidden,
            opacity: getComputedStyle(document.querySelector('#drawer-backdrop')).opacity,
          }));
          assert(cartOpen.drawer && cartOpen.backdrop && cartOpen.hidden === false && Number(cartOpen.opacity) > 0.9, `Cart did not open correctly: ${JSON.stringify(cartOpen)}`);
          await page.locator('[data-close-cart]').first().click();
          await page.waitForTimeout(400);
          assert(await page.locator('#drawer-backdrop').evaluate((node) => node.hidden), 'Cart backdrop did not close cleanly.');

          await browser.close();

          fs.writeFileSync('/tmp/mobile-verification.json', JSON.stringify({ initial, errors }, null, 2));
          if (errors.length) throw new Error(`Browser errors detected:\n${errors.join('\n')}`);
          console.log(JSON.stringify(initial, null, 2));
          EOF
          node /tmp/verify-mobile.mjs

      - name: Upload mobile verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: southernmost-mobile-visibility-20260725h
          path: |
            /tmp/southernmost-mobile-fixed.png
            /tmp/mobile-verification.json
          retention-days: 14
