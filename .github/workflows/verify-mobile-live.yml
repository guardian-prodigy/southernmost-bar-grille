name: Verify Southernmost mobile visibility live

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/verify-mobile-live.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-mobile:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for final public assets
        shell: bash
        run: |
          set -euo pipefail
          url="https://guardian-prodigy.github.io/southernmost-bar-grille/?v=20260725h&verify=3"
          for attempt in $(seq 1 48); do
            echo "Public deployment attempt ${attempt}/48"
            if curl -fsSL --connect-timeout 15 --max-time 60 "$url" -o /tmp/live.html \
              && grep -q "hotfix.css?v=20260725h" /tmp/live.html \
              && grep -q "hotfix.js?v=20260725h" /tmp/live.html; then
              echo "Final hotfix assets are public."
              exit 0
            fi
            sleep 10
          done
          echo "Final public assets were not published in time."
          head -c 1200 /tmp/live.html || true
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Chromium test runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium

      - name: Run mobile browser verification
        id: browser_test
        continue-on-error: true
        shell: bash
        run: |
          cat > /tmp/verify-mobile.mjs <<'EOF'
          import { chromium, devices } from 'playwright';
          import fs from 'node:fs';

          const output = { initial: null, guideOpen: null, cartOpen: null, browserErrors: [], failure: null };
          let browser;

          try {
            browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({ ...devices['Pixel 7'], locale: 'en-US', colorScheme: 'dark' });
            const page = await context.newPage();
            page.on('pageerror', (error) => output.browserErrors.push(`pageerror: ${error.message}`));
            page.on('console', (message) => { if (message.type() === 'error') output.browserErrors.push(`console: ${message.text()}`); });

            const url = 'https://guardian-prodigy.github.io/southernmost-bar-grille/?v=20260725h&verify=3';
            await page.goto(url, { waitUntil: 'networkidle', timeout: 120000 });
            await page.waitForTimeout(1400);

            output.initial = await page.evaluate(() => {
              const style = (selector) => {
                const node = document.querySelector(selector);
                if (!node) return null;
                const computed = getComputedStyle(node);
                return {
                  hidden: node.hidden,
                  display: computed.display,
                  visibility: computed.visibility,
                  opacity: Number(computed.opacity || 0),
                  filter: computed.filter,
                  backdropFilter: computed.backdropFilter || computed.webkitBackdropFilter || 'none',
                  transform: computed.transform,
                  pointerEvents: computed.pointerEvents,
                  rect: node.getBoundingClientRect().toJSON(),
                };
              };
              return {
                bodyClasses: document.body.className,
                guideBackdrop: style('#guide-backdrop'),
                drawerBackdrop: style('#drawer-backdrop'),
                modal: style('#flow-modal'),
                heroCopy: style('.hero__copy'),
                heroTitle: style('#hero-title'),
                mobileBar: style('.mobile-action-bar'),
                guidePanel: style('#guide-panel'),
                cartDrawer: style('#cart-drawer'),
                uiReady: document.documentElement.classList.contains('southernmost-ui-ready'),
                viewport: { width: innerWidth, height: innerHeight },
              };
            });

            await page.screenshot({ path: '/tmp/southernmost-mobile-fixed.png', fullPage: true });
            fs.writeFileSync('/tmp/mobile-initial.html', await page.content());

            const assert = (condition, message) => { if (!condition) throw new Error(message); };
            assert(output.initial.uiReady, 'Hotfix did not mark the UI ready.');
            assert(!output.initial.bodyClasses.includes('no-scroll'), 'Body remained locked on initial load.');

            for (const [name, layer] of [['guide', output.initial.guideBackdrop], ['drawer', output.initial.drawerBackdrop], ['modal', output.initial.modal]]) {
              assert(layer, `${name} layer is missing.`);
              assert(layer.hidden || layer.display === 'none' || (layer.visibility === 'hidden' && layer.pointerEvents === 'none'), `${name} layer is unexpectedly active: ${JSON.stringify(layer)}`);
              assert(layer.backdropFilter === 'none', `${name} layer is blurring the page while closed: ${JSON.stringify(layer)}`);
            }

            assert(output.initial.heroCopy && output.initial.heroCopy.opacity >= 0.99 && output.initial.heroCopy.visibility === 'visible', `Hero content is not visible: ${JSON.stringify(output.initial.heroCopy)}`);
            assert(output.initial.heroCopy.filter === 'none', `Hero content is filtered: ${JSON.stringify(output.initial.heroCopy)}`);
            assert(output.initial.mobileBar && output.initial.mobileBar.opacity >= 0.99 && output.initial.mobileBar.visibility === 'visible' && output.initial.mobileBar.display !== 'none', `Mobile dock is not stable: ${JSON.stringify(output.initial.mobileBar)}`);

            const guideButton = page.locator('.mobile-action-bar [data-open-guide]');
            await guideButton.click();
            await page.waitForTimeout(450);
            output.guideOpen = await page.evaluate(() => ({
              panel: document.querySelector('#guide-panel')?.classList.contains('is-open'),
              backdrop: document.querySelector('#guide-backdrop')?.classList.contains('is-open'),
              hidden: document.querySelector('#guide-backdrop')?.hidden,
              opacity: getComputedStyle(document.querySelector('#guide-backdrop')).opacity,
            }));
            assert(output.guideOpen.panel && output.guideOpen.backdrop && output.guideOpen.hidden === false && Number(output.guideOpen.opacity) > 0.9, `Guide did not open correctly: ${JSON.stringify(output.guideOpen)}`);
            await page.locator('[data-close-guide]').click();
            await page.waitForTimeout(400);
            assert(await page.locator('#guide-backdrop').evaluate((node) => node.hidden), 'Guide backdrop did not close cleanly.');

            const cartButton = page.locator('.mobile-action-bar [data-open-cart]');
            await cartButton.click();
            await page.waitForTimeout(450);
            output.cartOpen = await page.evaluate(() => ({
              drawer: document.querySelector('#cart-drawer')?.classList.contains('is-open'),
              backdrop: document.querySelector('#drawer-backdrop')?.classList.contains('is-open'),
              hidden: document.querySelector('#drawer-backdrop')?.hidden,
              opacity: getComputedStyle(document.querySelector('#drawer-backdrop')).opacity,
            }));
            assert(output.cartOpen.drawer && output.cartOpen.backdrop && output.cartOpen.hidden === false && Number(output.cartOpen.opacity) > 0.9, `Cart did not open correctly: ${JSON.stringify(output.cartOpen)}`);
            await page.locator('[data-close-cart]').first().click();
            await page.waitForTimeout(400);
            assert(await page.locator('#drawer-backdrop').evaluate((node) => node.hidden), 'Cart backdrop did not close cleanly.');
          } catch (error) {
            output.failure = error?.stack || String(error);
          } finally {
            fs.writeFileSync('/tmp/mobile-verification.json', JSON.stringify(output, null, 2));
            await browser?.close().catch(() => {});
          }

          console.log(JSON.stringify(output, null, 2));
          if (output.failure) process.exit(1);
          EOF
          node /tmp/verify-mobile.mjs

      - name: Upload mobile verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: southernmost-mobile-visibility-20260725h
          path: |
            /tmp/southernmost-mobile-fixed.png
            /tmp/mobile-verification.json
            /tmp/mobile-initial.html
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce browser verification result
        if: always()
        shell: bash
        run: |
          test "${{ steps.browser_test.outcome }}" = "success"
