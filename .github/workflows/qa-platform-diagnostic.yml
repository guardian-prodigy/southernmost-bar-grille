name: Diagnose Southernmost Platform QA

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Prepare browser and server
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts playwright-core@1.55.0
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$chrome"
          echo "CHROME_PATH=$chrome" >> "$GITHUB_ENV"
          nohup python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/sm-server.log 2>&1 &
          for n in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/sm-server.log
          exit 1
      - name: Run diagnostic journey
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/sm-diagnostic
          cat > /tmp/sm-diagnostic/diagnose.mjs <<'NODE'
          import { chromium } from "playwright-core";
          import fs from "node:fs";
          const base = "http://127.0.0.1:4173";
          const report = { phase: "start", steps: [], errors: [] };
          const mark = (phase, data={}) => { report.phase=phase; report.steps.push({ phase, ...data }); fs.writeFileSync("/tmp/sm-diagnostic/report.json", JSON.stringify(report,null,2)); };
          let browser;
          try {
            mark("launch");
            browser = await chromium.launch({ executablePath: process.env.CHROME_PATH, headless:true, args:["--no-sandbox","--disable-dev-shm-usage","--disable-gpu"] });
            const desktop = await browser.newContext({ viewport:{width:1440,height:1000}, serviceWorkers:"allow" });
            for (const route of ["/","/menu/","/events/","/private-events/","/visit/","/loyalty/","/staff/","/admin/"]) {
              mark(`route:${route}`);
              const page = await desktop.newPage();
              page.on("pageerror", e => report.errors.push(`${route}: ${e.message}`));
              await page.goto(base+route,{waitUntil:"domcontentloaded",timeout:120000});
              await page.waitForSelector('body[data-release="20260727b"]',{timeout:30000});
              await page.waitForTimeout(500);
              const state=await page.evaluate(()=>({height:document.querySelector("#page-root")?.getBoundingClientRect().height||0,overflow:document.documentElement.scrollWidth-innerWidth,body:document.body.dataset.page}));
              report.steps.push({route,state});
              if(route==="/") await page.screenshot({path:"/tmp/sm-diagnostic/home.png"});
              await page.close();
            }
            mark("menu-interaction");
            const menu=await desktop.newPage();
            await menu.goto(base+"/menu/",{waitUntil:"domcontentloaded"}); await menu.waitForTimeout(800);
            report.steps.push({menu:{cards:await menu.locator(".menu-card").count(),filters:await menu.locator("#menu-filters .filter").count(),next:await menu.locator("[data-book-next]").count()}});
            await menu.locator("[data-book-next]").click(); await menu.close();
            mark("mobile");
            const mobileContext=await browser.newContext({viewport:{width:412,height:915},isMobile:true,hasTouch:true,serviceWorkers:"allow"});
            const mobile=await mobileContext.newPage(); await mobile.goto(base+"/menu/",{waitUntil:"domcontentloaded"}); await mobile.waitForTimeout(800);
            report.steps.push({mobile:{dock:await mobile.locator(".mobile-dock").count(),book:await mobile.locator(".mobile-book").count(),next:await mobile.locator("[data-book-next]").count()}});
            await mobile.locator("[data-book-next]").click(); await mobileContext.close();
            mark("order");
            const orderContext=await browser.newContext({viewport:{width:412,height:915},isMobile:true,hasTouch:true,serviceWorkers:"allow"});
            const order=await orderContext.newPage();
            await order.goto(base+"/order/?table=12&zone=dining&token=SM-DINING-12",{waitUntil:"domcontentloaded"});
            await order.evaluate(()=>localStorage.clear()); await order.reload({waitUntil:"domcontentloaded"});
            await order.waitForSelector("#verify-form",{timeout:20000});
            await order.locator('input[name="firstName"]').fill("Alex"); await order.locator('input[name="phone"]').fill("5615550188"); await order.locator('input[name="ageConfirmed"]').check();
            await order.locator("#verify-form").evaluate(form=>form.requestSubmit()); await order.waitForSelector('[data-authorize="digital"]'); await order.locator('[data-authorize="digital"]').click(); await order.waitForSelector(".order-layout");
            report.steps.push({order:{cards:await order.locator(".menu-card").count(),items:await order.locator("[data-item]").count(),submit:await order.locator("[data-submit-round]").count()}});
            await order.locator("[data-item]").first().click(); await order.waitForSelector("#item-form"); await order.locator("#item-form").evaluate(form=>form.requestSubmit());
            await order.waitForTimeout(250); await order.locator("[data-submit-round]").click(); await order.waitForTimeout(250);
            await order.screenshot({path:"/tmp/sm-diagnostic/order.png"}); await orderContext.close();
            mark("service-worker");
            const page=await desktop.newPage(); await page.goto(base+"/",{waitUntil:"domcontentloaded"});
            const worker=await page.evaluate(async()=>{const reg=await Promise.race([navigator.serviceWorker.ready,new Promise((_,r)=>setTimeout(()=>r(new Error("timeout")),15000))]);return{state:reg.active?.state,caches:await caches.keys()}});
            report.steps.push({worker}); await page.close(); await desktop.close();
            mark("complete");
          } catch (error) {
            report.errors.push(error.stack || String(error));
            mark("failed", { error: error.message });
            process.exitCode=1;
          } finally {
            if(browser) await browser.close().catch(()=>{});
            fs.writeFileSync("/tmp/sm-diagnostic/report.json", JSON.stringify(report,null,2));
            console.log(JSON.stringify(report,null,2));
          }
          NODE
          node /tmp/sm-diagnostic/diagnose.mjs > /tmp/sm-diagnostic/run.log 2>&1
          status=$?
          cat /tmp/sm-diagnostic/run.log
          exit $status
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: southernmost-platform-v5-diagnostics
          path: /tmp/sm-diagnostic
          if-no-files-found: error
          retention-days: 3
