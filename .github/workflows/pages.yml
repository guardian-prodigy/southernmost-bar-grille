name: Deploy Southernmost

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate complete website
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          test -s assets/og-southernmost.jpg
          test -s assets/southernmost-wordmark.webp
          test -s three-scenes-v2.js
          test -s upgrade.css
          test -s upgrade.js
          grep -q "southernmost-bar-grille" robots.txt
          grep -q "southernmost-bar-grille" sitemap.xml
          ! grep -Rqi "guardian-prodigy.github.io/developers" robots.txt sitemap.xml index.html
          ! grep -Rqi "atob(" index.html app.js upgrade.js three-scenes-v2.js
          ! grep -Eqi '>[^<]*(demo|demonstration)[^<]*<' index.html

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
