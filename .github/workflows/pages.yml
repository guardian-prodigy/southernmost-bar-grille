name: Deploy Southernmost Platform

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate production platform
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          node --check platform-store.js
          node --check platform.js
          node --check three-scenes-pro.js
          node --check data.js
          node --check sw.js
          test -s assets/southernmost-wordmark.webp
          test -s assets/og-southernmost.jpg
          test -s assets/qr-table-12.png
          test -s order/index.html
          test -s staff/index.html
          test -s admin/index.html
          grep -q 'data-release="20260727b"' index.html
          grep -q 'southernmost-v18-20260727b' sw.js
          ! grep -Rqi 'atob(' index.html platform-store.js platform.js three-scenes-pro.js
          ! grep -RqiE '>[^<]*(demo|demonstration)[^<]*<' index.html menu/index.html order/index.html events/index.html private-events/index.html visit/index.html loyalty/index.html staff/index.html admin/index.html

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
