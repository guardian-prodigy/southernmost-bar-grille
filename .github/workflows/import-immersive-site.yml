name: Import immersive Southernmost website

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-immersive-site.yml"
      - ".github/IMPORT_VERIFY"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/import-immersive-site.yml"
      - ".github/IMPORT_VERIFY"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: southernmost-source-import-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download validated website package
        shell: bash
        run: |
          set -u
          urls=(
            "https://platform-cs-va6c2.adobe.io/content/storage/id/urn:aaid:sc:VA6C2:9a482877-ea9a-408d-803b-5a6d094e7ce8"
            "https://at.adobe.com/bQFMhhCxsllcshgU"
            "https://www.adobe.com/files/id/urn:aaid:sc:VA6C2:9a482877-ea9a-408d-803b-5a6d094e7ce8"
          )
          found=""
          for url in "${urls[@]}"; do
            echo "Trying $url"
            rm -f /tmp/southernmost-package
            if curl -A "Mozilla/5.0" -fL --retry 2 --connect-timeout 20 --max-time 120 "$url" -o /tmp/southernmost-package; then
              file /tmp/southernmost-package || true
              ls -lh /tmp/southernmost-package
              if unzip -tq /tmp/southernmost-package >/dev/null 2>&1; then
                found="/tmp/southernmost-package"
                break
              fi
            fi
          done
          if [ -z "$found" ]; then
            echo "None of the authorized download endpoints returned the ZIP package."
            exit 1
          fi
          mv "$found" /tmp/southernmost.zip
          unzip -t /tmp/southernmost.zip

      - name: Materialize actual source tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/southernmost-site /tmp/current-github
          mkdir -p /tmp/southernmost-site
          unzip -q /tmp/southernmost.zip -d /tmp/southernmost-site
          test -s /tmp/southernmost-site/index.html
          test -s /tmp/southernmost-site/styles.css
          test -s /tmp/southernmost-site/app.js
          test -s /tmp/southernmost-site/three-scenes.js
          cp -a .github /tmp/current-github
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/southernmost-site/. .
          rm -rf .github
          cp -a /tmp/current-github .github
          touch .nojekyll

      - name: Validate website
        shell: bash
        run: |
          set -euo pipefail
          npm run check

      - name: Stage production source branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B generated/immersive-source
          git add -A
          git commit -m "Stage immersive Southernmost client experience"
          git push --force origin HEAD:generated/immersive-source
