name: Verify live Southernmost mobile hotfix v2

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/verify-mobile-hotfix-v2.yml"
      - ".github/scripts/verify-mobile-hotfix.mjs"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - name: Install Playwright package
        run: npm install --no-save --silent playwright@1.55.0

      - name: Verify deployed mobile UI
        run: node .github/scripts/verify-mobile-hotfix.mjs

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-hotfix-live-v2
          path: /tmp/mobile-hotfix-live.png
          if-no-files-found: ignore
