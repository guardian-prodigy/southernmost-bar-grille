name: Verify live Southernmost mobile hotfix v2

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/verify-mobile-hotfix-v2.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Install Playwright package
        shell: bash
        run: |
          mkdir -p /tmp/mobile-verify
          cd /tmp/mobile-verify
          npm init -y >/dev/null 2>&1
          npm install --no-save --silent playwright@1.55.0

      - name: Download verification script
        shell: bash
        run: |
          curl -fsSL --connect-timeout 15 --max-time 60 \
            "https://raw.githubusercontent.com/guardian-prodigy/southernmost-bar-grille/6c07b1060531a8a8165159ebc71ce1f9e946b8a9/.github/scripts/verify-mobile-hotfix.mjs" \
            -o /tmp/mobile-verify/check.mjs

      - name: Verify deployed mobile UI
        shell: bash
        run: |
          cd /tmp/mobile-verify
          NODE_PATH=/tmp/mobile-verify/node_modules node check.mjs

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-hotfix-live-v2
          path: /tmp/mobile-hotfix-live.png
          if-no-files-found: ignore
