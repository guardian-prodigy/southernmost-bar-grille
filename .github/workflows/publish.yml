name: Publish Southernmost

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish.yml"
      - "bootstrap/**"
      - "site/**"
      - "README.md"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/publish.yml"
      - "bootstrap/**"
      - "site/**"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: southernmost-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Recover archive segments
        shell: bash
        run: |
          set -euo pipefail
          git cat-file blob 49d666b9ba92c77d083fd2c590a2d2e5f0024540 > /tmp/original-middle.b64
          head -c 10000 /tmp/original-middle.b64 > /tmp/chunk-01.b64
          dd if=/tmp/original-middle.b64 of=/tmp/chunk-02.b64 bs=1 skip=10000 count=10000 status=none
          test "$(wc -c < /tmp/chunk-01.b64)" -eq 10000
          test "$(wc -c < /tmp/chunk-02.b64)" -eq 10000

      - name: Assemble encoded website package
        shell: bash
        run: |
          set -euo pipefail
          {
            cat bootstrap/source.b64.00
            cat /tmp/chunk-01.b64
            cat /tmp/chunk-02.b64
            for part in bootstrap/source.b64.{03..11}; do
              test -f "$part"
              cat "$part"
            done
          } | tr -d '\r\n\t ' > /tmp/southernmost.b64
          test "$(wc -c < /tmp/southernmost.b64)" -eq 116076
          echo "556b6175abe7b81c558b49dcbaddcd79d61c332ddaea21718d54ae494f1569b2  /tmp/southernmost.b64" | sha256sum --check

      - name: Decode website ZIP
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode /tmp/southernmost.b64 > /tmp/southernmost.zip
          test "$(wc -c < /tmp/southernmost.zip)" -eq 87055
          echo "354d97ce97a4ce5cf8020e9e7b6700f5b25114084c5c76827b7d2aef3c2e3bfe  /tmp/southernmost.zip" | sha256sum --check

      - name: Test ZIP integrity
        shell: bash
        run: |
          set -euo pipefail
          unzip -t /tmp/southernmost.zip

      - name: Extract website
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site
          unzip -q /tmp/southernmost.zip -d site
          test -s site/index.html
          test -s site/styles.css
          test -s site/app.js
          touch site/.nojekyll

      - name: Validate website
        shell: bash
        run: |
          set -euo pipefail
          cd site
          npm run check

      - name: Commit extracted source files
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f site
          if ! git diff --cached --quiet; then
            git commit -m "Materialize complete Southernmost website"
            git push origin HEAD:main
          fi

      - name: Configure GitHub Pages
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
