name: Publish Southernmost

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: southernmost-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Materialize complete website
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site
          cat source/chunks/part-* > /tmp/southernmost-site.tar.xz.b64
          base64 --decode /tmp/southernmost-site.tar.xz.b64 > /tmp/southernmost-site.tar.xz
          tar -xJf /tmp/southernmost-site.tar.xz -C site
          touch site/.nojekyll
          cd site
          node scripts/validate.mjs

      - name: Commit materialized website to repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f site
          if ! git diff --cached --quiet; then
            git commit -m "Materialize complete Southernmost website"
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              git push origin "HEAD:${{ github.head_ref }}"
            else
              git push origin HEAD:main
            fi
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
