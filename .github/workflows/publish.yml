name: Publish Southernmost

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish.yml"
      - "README.md"
      - "site/**"
  pull_request:
    branches: [main]
    paths:
      - "README.md"
      - "site/**"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: southernmost-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Build standalone site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/guardian-prodigy/whackamole.github.io/main/southernmost-ultimate/payload.txt" \
            -o /tmp/southernmost.b64
          tr -d '\r\n\t ' < /tmp/southernmost.b64 | base64 --decode | gzip --decompress > site/index.html
          python3 - <<'PY'
          from pathlib import Path
          path = Path('site/index.html')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'Interactive Demo': 'Interactive Experience',
              'interactive demo': 'interactive experience',
              'Ultimate Demo': 'Ultimate Experience',
              'ultimate demo': 'ultimate experience',
              'Demonstration': 'Experience',
              'demonstration': 'experience',
              'Demo': 'Experience',
              'demo': 'experience',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
          touch site/.nojekyll

      - name: Commit materialized site source
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/index.html site/.nojekyll
          if ! git diff --cached --quiet; then
            git commit -m "Materialize standalone Southernmost website"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
