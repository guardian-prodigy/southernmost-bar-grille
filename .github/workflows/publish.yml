name: Publish Southernmost

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish.yml"
      - "bootstrap/**"
      - "site/**"
      - "README.md"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/publish.yml"
      - "bootstrap/**"
      - "site/**"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: southernmost-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Materialize complete website
        shell: bash
        run: |
          set -euo pipefail
          test -f bootstrap/source.b64.00
          test -f bootstrap/source.b64.01
          cat bootstrap/source.b64.* | tr -d '\r\n\t ' | base64 --decode > /tmp/southernmost.zip
          unzip -t /tmp/southernmost.zip
          rm -rf site
          mkdir -p site
          unzip -q /tmp/southernmost.zip -d site
          test -s site/index.html
          test -s site/styles.css
          test -s site/app.js
          touch site/.nojekyll

      - name: Validate website
        shell: bash
        run: |
          set -euo pipefail
          cd site
          npm run check

      - name: Commit extracted source files
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f site
          if ! git diff --cached --quiet; then
            git commit -m "Materialize complete Southernmost website"
            git push origin HEAD:main
          fi

      - name: Configure GitHub Pages
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

# Deployment trigger: publish complete client site.
