name: Materialize Southernmost platform v5

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/materialize-platform-v5.yml"
  pull_request:
    branches: [main]
    paths:
      - ".github/MATERIALIZE_PLATFORM_V5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: southernmost-platform-v5-materialize-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout deployment branch
        uses: actions/checkout@v4
        with:
          ref: deploy/platform-v5-20260727b
          fetch-depth: 0

      - name: Download and verify release package
        shell: bash
        run: |
          set -euo pipefail
          expected="1bab3471584af6c2f1b295347ddc60b713a98770de126be678c47e1361631979"
          urls=(
            "https://platform-cs-va6c2.adobe.io/content/storage/id/urn:aaid:sc:VA6C2:61561a28-81fc-4b07-a3d5-8e0c9bb0e62e"
            "https://at.adobe.com/rsyCUdVvUaYPiLHW"
          )
          valid=""
          for url in "${urls[@]}"; do
            echo "Trying ${url}"
            rm -f /tmp/southernmost-platform-v5.zip
            if curl -A "Mozilla/5.0" -fL --retry 3 --connect-timeout 20 --max-time 240 "$url" -o /tmp/southernmost-platform-v5.zip; then
              actual="$(sha256sum /tmp/southernmost-platform-v5.zip | awk '{print $1}')"
              echo "Downloaded SHA-256: ${actual}"
              if [ "$actual" = "$expected" ] && unzip -tq /tmp/southernmost-platform-v5.zip >/dev/null; then
                valid=yes
                break
              fi
            fi
          done
          test -n "$valid"
          unzip -t /tmp/southernmost-platform-v5.zip

      - name: Replace branch with platform source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/southernmost-platform-v5
          mkdir -p /tmp/southernmost-platform-v5
          unzip -q /tmp/southernmost-platform-v5.zip -d /tmp/southernmost-platform-v5
          rm -rf /tmp/southernmost-platform-v5/.github
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a /tmp/southernmost-platform-v5/. .
          touch .nojekyll

      - name: Prepare Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run production validation
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          node --check platform-store.js
          node --check platform.js
          node --check three-scenes-pro.js
          node --check data.js
          node --check sw.js
          grep -q 'data-release="20260727b"' index.html
          grep -q 'southernmost-v18-20260727b' sw.js
          test -s assets/southernmost-wordmark.webp
          test -s assets/og-southernmost.jpg
          test -s assets/qr-table-12.png
          ! grep -Rqi 'atob(' index.html platform-store.js platform.js three-scenes-pro.js
          ! grep -RqiE '>[^<]*(demo|demonstration)[^<]*<' index.html menu/index.html order/index.html events/index.html private-events/index.html visit/index.html loyalty/index.html staff/index.html admin/index.html

      - name: Commit and publish deployment branch
        id: publish
        shell: bash
        run: |
          set +e
          exec > >(tee /tmp/platform-v5-publish.log) 2>&1
          echo "EVENT=${GITHUB_EVENT_NAME} REF=${GITHUB_REF} SHA=${GITHUB_SHA}"
          git branch -vv
          git remote -v
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          echo "--- staged summary ---"
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo "No platform changes were generated."
            exit 10
          fi
          git commit -m "Deploy Southernmost platform v5 20260727b"
          commit_status=$?
          echo "commit_status=${commit_status}"
          git log -1 --oneline
          git push --force-with-lease origin HEAD:deploy/platform-v5-20260727b
          push_status=$?
          echo "push_status=${push_status}"
          exit $(( commit_status != 0 || push_status != 0 ))

      - name: Upload publication diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: southernmost-platform-v5-publication-diagnostics
          path: /tmp/platform-v5-publish.log
          if-no-files-found: warn
          retention-days: 3
