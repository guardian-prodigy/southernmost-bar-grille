name: Import final Southernmost refinement

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-final-refinement.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: southernmost-final-refinement
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and verify final package
        shell: bash
        run: |
          set -euo pipefail
          expected="288efcea3e833f8246d6ddfbb57cb9b29f38371074506d19cbff70d2dcc59156"
          urls=(
            "https://platform-cs-va6c2.adobe.io/content/storage/id/urn:aaid:sc:VA6C2:d87b07b3-6c19-45ec-897f-07365df6b9ee"
            "https://at.adobe.com/Bn0nwzesiJobcsVo"
          )
          found=""
          for url in "${urls[@]}"; do
            echo "Trying $url"
            rm -f /tmp/southernmost-final.zip
            if curl -A "Mozilla/5.0" -fL --retry 3 --connect-timeout 20 --max-time 180 "$url" -o /tmp/southernmost-final.zip; then
              actual="$(sha256sum /tmp/southernmost-final.zip | awk '{print $1}')"
              echo "Downloaded SHA-256: $actual"
              if [ "$actual" = "$expected" ] && unzip -tq /tmp/southernmost-final.zip >/dev/null; then
                found="yes"
                break
              fi
            fi
          done
          test -n "$found"
          unzip -t /tmp/southernmost-final.zip

      - name: Materialize and validate source branch
        shell: bash
        run: |
          set -euo pipefail
          branch="deploy/final-refinement-20260725f"
          git switch -C "$branch" origin/main

          rm -rf /tmp/southernmost-final
          mkdir -p /tmp/southernmost-final
          unzip -q /tmp/southernmost-final.zip -d /tmp/southernmost-final

          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a /tmp/southernmost-final/. .
          touch .nojekyll

          npm run check
          test -s assets/og-southernmost.jpg
          test -s assets/southernmost-wordmark.webp
          test -s three-scenes-v2.js
          grep -q "20260725f" index.html
          grep -q "southernmost-v14-20260725f" sw.js
          grep -q "southernmost-bar-grille" robots.txt
          grep -q "southernmost-bar-grille" sitemap.xml
          ! grep -Rqi "guardian-prodigy.github.io/developers" robots.txt sitemap.xml index.html
          ! grep -Rqi "atob(" index.html app.js upgrade.js three-scenes-v2.js

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy final Southernmost refinement"
          git push --force origin "HEAD:$branch"
