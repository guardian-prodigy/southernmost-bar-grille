name: Materialize Southernmost production polish

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/materialize-production-polish-20260726a.yml"
  pull_request:
    branches: [main]
    paths:
      - ".github/MATERIALIZE_PRODUCTION_POLISH"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: southernmost-production-polish-20260726a-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staged deployment branch
        uses: actions/checkout@v4
        with:
          ref: deploy/production-polish-20260726a
          fetch-depth: 0

      - name: Reconstruct and verify patch archive
        shell: bash
        run: |
          set -euo pipefail
          test "$(find .deploy/patch-20260726a -maxdepth 1 -type f -name 'part-*' | wc -l)" -eq 9
          cat .deploy/patch-20260726a/part-* > /tmp/southernmost-patch.b64
          base64 --decode /tmp/southernmost-patch.b64 > /tmp/southernmost-patch.tar.gz
          echo "4c12ca51ee176ec7b81d7bf468743297313e43157ad37e8a9289bdba06317ebe  /tmp/southernmost-patch.tar.gz" | sha256sum --check --strict
          tar -tzf /tmp/southernmost-patch.tar.gz >/tmp/patch-files.txt
          grep -q '^index.html$' /tmp/patch-files.txt
          grep -q '^app.js$' /tmp/patch-files.txt
          grep -q '^upgrade.css$' /tmp/patch-files.txt
          grep -q '^assets/qr-table-12.png$' /tmp/patch-files.txt

      - name: Apply source patch
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf /tmp/southernmost-patch.tar.gz -C .
          while IFS= read -r file; do
            [ -z "$file" ] || rm -f -- "$file"
          done < .delete-files
          rm -f .delete-files
          rm -rf .deploy
          touch .nojekyll

      - name: Validate production source
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          test ! -e hotfix.css
          test ! -e hotfix.js
          test -s assets/qr-table-12.png
          test -s assets/qr-patio-07.png
          test -s assets/qr-bar-03.png
          test -s assets/qr-lounge-04.png
          test -s qr/lounge-04.html
          grep -q '20260726a' index.html
          grep -q 'southernmost-v15-20260726a' sw.js
          ! grep -Rqi 'atob(' index.html app.js upgrade.js three-scenes-v2.js
          ! grep -RqiE '>[^<]*(demo|demonstration)[^<]*<' index.html admin/qr-kit.html legal/*.html

      - name: Commit materialized source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git diff --cached --quiet && { echo "No source changes were materialized."; exit 1; }
          git commit -m "Deploy Southernmost production polish 20260726a"
          git push origin HEAD:deploy/production-polish-20260726a
