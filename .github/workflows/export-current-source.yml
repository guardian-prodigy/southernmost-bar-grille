name: Export current Southernmost source

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/export-current-source.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Package current source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/export
          tar --exclude='.git' --exclude='.github/workflows/export-current-source.yml' -czf /tmp/export/southernmost-current-source.tar.gz .
          sha256sum /tmp/export/southernmost-current-source.tar.gz
      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: southernmost-current-source
          path: /tmp/export/southernmost-current-source.tar.gz
          if-no-files-found: error
          retention-days: 1
