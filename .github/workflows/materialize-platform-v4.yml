name: Materialize Southernmost platform v4

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/MATERIALIZE_PLATFORM_V4"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: southernmost-platform-v4-materialize-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployment branch
        uses: actions/checkout@v4
        with:
          ref: deploy/platform-v4-20260727a
          fetch-depth: 0

      - name: Reconstruct and diagnose source archive
        shell: bash
        run: |
          set -u
          expected_names=(part-00 part-01 part-02 part-03 part-04 part-05 part-06 part-07 part-08 part-09 part-10 part-11)
          expected_lengths=(12000 12000 12000 12000 12000 12000 12000 12000 12000 12000 12000 10140)
          expected_hashes=(
            a4ec801436e87d148e4d6a3bbd88fd22b07e88394ff015b833fa8cc031fa227e
            240f939cb1e11b2fab234ed4bcaebdc4f65eb4b27b3d4ad913f07c66e643efda
            f2e20233a2ce0d28270bc8e3f56eb14ca915ea6c63826594f662e2b95fa4f3a1
            0e4190cc8afd7cabc49cabe5f983ebad4a211cecc968ae7b66c3c336a47b37a5
            0bd94bd0efd237067f53580e2509dcb91bdd495cadb12b6a3b4b4bf2be0c6f7e
            f97e484deb99c7034cc9af4d0bf1b0fca6628c61f9f0804318fbc1fc29db1150
            e0b8d06b1061532d8fee2c305ead914581456f8c36f160e5912b2b2895e18833
            61292004b16b1756a65f241a116b7552e139d0aa5d699641c396157e2e332774
            e1b432002b346cd2fd9c4796f8a0ab3c64c34ac02f889990c44747b11867d52e
            2f16529a3f2ec3bc8f145a9da10e3a583ef88bef5a46fae6f36dffb39c827e93
            57efb5d530d1027c1d3faa5a379cf2322d274fcbe41074176e58b49ef248c17d
            4a3076ba0a6a6a55b893a24ea0d9ac3220e06bd5e2e10de0f09f35f1c69b170a
          )

          diagnostics=/tmp/platform-v4-diagnostics.txt
          : > "$diagnostics"
          valid=1
          actual_count="$(find .deploy/platform-v4 -maxdepth 1 -type f -name 'part-*' 2>/dev/null | wc -l | tr -d ' ')"
          echo "part_count actual=${actual_count} expected=12" | tee -a "$diagnostics"
          [ "$actual_count" -eq 12 ] || valid=0

          for index in "${!expected_names[@]}"; do
            file=".deploy/platform-v4/${expected_names[$index]}"
            if [ ! -f "$file" ]; then
              echo "${expected_names[$index]} MISSING expected_length=${expected_lengths[$index]} expected_sha256=${expected_hashes[$index]}" | tee -a "$diagnostics"
              valid=0
              continue
            fi
            actual_length="$(wc -c < "$file" | tr -d ' ')"
            actual_hash="$(sha256sum "$file" | awk '{print $1}')"
            echo "${expected_names[$index]} actual_length=${actual_length} expected_length=${expected_lengths[$index]} actual_sha256=${actual_hash} expected_sha256=${expected_hashes[$index]}" | tee -a "$diagnostics"
            [ "$actual_length" -eq "${expected_lengths[$index]}" ] || valid=0
            [ "$actual_hash" = "${expected_hashes[$index]}" ] || valid=0
          done

          if [ "$valid" -eq 1 ]; then
            : > /tmp/platform-v4.b64
            for name in "${expected_names[@]}"; do cat ".deploy/platform-v4/${name}" >> /tmp/platform-v4.b64; done
            joined_length="$(wc -c < /tmp/platform-v4.b64 | tr -d ' ')"
            joined_hash="$(sha256sum /tmp/platform-v4.b64 | awk '{print $1}')"
            echo "joined_base64 length=${joined_length} sha256=${joined_hash}" | tee -a "$diagnostics"
            [ "$joined_length" -eq 142140 ] || valid=0
          fi

          if [ "$valid" -eq 1 ]; then
            if base64 --decode /tmp/platform-v4.b64 > /tmp/platform-v4.tar.gz; then
              archive_length="$(wc -c < /tmp/platform-v4.tar.gz | tr -d ' ')"
              archive_hash="$(sha256sum /tmp/platform-v4.tar.gz | awk '{print $1}')"
              echo "archive actual_length=${archive_length} expected_length=106603 actual_sha256=${archive_hash} expected_sha256=abd2e35e7ee921ecd765f54e673550bc7daec7b01fe31b7a50ae2f9b8327c355" | tee -a "$diagnostics"
              [ "$archive_length" -eq 106603 ] || valid=0
              [ "$archive_hash" = "abd2e35e7ee921ecd765f54e673550bc7daec7b01fe31b7a50ae2f9b8327c355" ] || valid=0
            else
              echo "archive base64_decode=FAILED" | tee -a "$diagnostics"
              valid=0
            fi
          fi

          if [ "$valid" -eq 1 ]; then
            if tar -tzf /tmp/platform-v4.tar.gz > /tmp/platform-v4-files.txt; then
              echo "archive tar_list=OK file_count=$(wc -l < /tmp/platform-v4-files.txt | tr -d ' ')" | tee -a "$diagnostics"
              for required in index.html platform.js order/index.html staff/index.html admin/index.html; do
                grep -q "^${required}$" /tmp/platform-v4-files.txt || { echo "archive missing_required=${required}" | tee -a "$diagnostics"; valid=0; }
              done
            else
              echo "archive tar_list=FAILED" | tee -a "$diagnostics"
              valid=0
            fi
          fi

          echo "valid=${valid}" | tee -a "$diagnostics"
          if [ "$valid" -eq 1 ]; then touch /tmp/platform-v4-valid; fi

      - name: Upload reconstruction diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: southernmost-platform-v4-reconstruction-diagnostics
          path: /tmp/platform-v4-diagnostics.txt
          if-no-files-found: error
          retention-days: 3

      - name: Require valid platform archive
        shell: bash
        run: test -f /tmp/platform-v4-valid

      - name: Materialize platform source
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf /tmp/platform-v4.tar.gz -C .
          rm -rf .deploy
          rm -f app.js upgrade.css upgrade.js three-scenes-v2.js three-scenes.js hotfix.css hotfix.js
          touch .nojekyll

      - name: Validate complete platform
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          node --check platform-store.js
          node --check platform.js
          node --check three-scenes-pro.js
          node --check data.js
          node --check sw.js
          test -s assets/southernmost-wordmark.webp
          test -s assets/og-southernmost.jpg
          test -s assets/qr-table-12.png
          grep -q 'data-release="20260727a"' index.html
          grep -q 'southernmost-v17-20260727a' sw.js
          grep -q 'setupStaffPage' platform.js
          grep -q 'setupAdminPage' platform.js
          grep -q 'setupOrderPage' platform.js
          ! grep -Rqi 'atob(' index.html platform-store.js platform.js three-scenes-pro.js
          ! grep -RqiE '>[^<]*(demo|demonstration)[^<]*<' index.html menu/index.html order/index.html events/index.html private-events/index.html visit/index.html loyalty/index.html staff/index.html admin/index.html

      - name: Commit platform source to deployment branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git diff --cached --quiet && { echo "No platform changes were generated."; exit 1; }
          git commit -m "Deploy Southernmost platform v4 20260727a"
          git push origin HEAD:deploy/platform-v4-20260727a
