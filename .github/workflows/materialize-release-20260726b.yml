name: Materialize Southernmost release 20260726b

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/materialize-release-20260726b.yml"
  pull_request:
    branches: [main]
    paths:
      - ".github/APPLY_RELEASE_20260726B"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: southernmost-materialize-20260726b-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dedicated release branch
        uses: actions/checkout@v4
        with:
          ref: deploy/production-polish-20260726b
          fetch-depth: 0
          show-progress: false

      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install QR build dependency
        run: python -m pip install --disable-pip-version-check "qrcode[pil]==8.2"

      - name: Apply deterministic production polish
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:.github/scripts/apply-production-polish-20260726b.py > /tmp/apply-production-polish.py
          python /tmp/apply-production-polish.py
          rm -rf .deploy
          touch .nojekyll

      - name: Validate the complete release
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          node --check app.js
          node --check data.js
          node --check upgrade.js
          node --check three-scenes-v2.js
          node --check sw.js
          test ! -e hotfix.css
          test ! -e hotfix.js
          test -s assets/qr-table-12.png
          test -s assets/qr-patio-07.png
          test -s assets/qr-bar-03.png
          test -s assets/qr-lounge-04.png
          test -s qr/table-12.html
          test -s qr/patio-07.html
          test -s qr/bar-03.html
          test -s qr/lounge-04.html
          grep -q 'data-release="20260726b"' index.html
          grep -q 'styles.css?v=20260726b' index.html
          grep -q 'upgrade.css?v=20260726b' index.html
          grep -q 'app.js?v=20260726b' index.html
          grep -q 'upgrade.js?v=20260726b' index.html
          grep -q 'three-scenes-v2.js?v=20260726b' index.html
          grep -q 'southernmost-v16-20260726b' sw.js
          grep -q 'table=12' qr/table-12.html
          grep -q 'zone=dining' qr/table-12.html
          grep -q 'table=07' qr/patio-07.html
          grep -q 'zone=patio' qr/patio-07.html
          grep -q 'table=03' qr/bar-03.html
          grep -q 'zone=bar' qr/bar-03.html
          grep -q 'station=04' qr/lounge-04.html
          grep -q 'zone=lounge' qr/lounge-04.html
          grep -q 'Southernmost Island Guide' index.html
          grep -q 'mobile-book-reader' index.html
          grep -q 'southernmost-wordmark.webp' index.html
          ! grep -Rqi 'atob(' index.html app.js upgrade.js three-scenes-v2.js
          ! grep -Rqi '20260725h' index.html app.js upgrade.js upgrade.css sw.js
          ! grep -Rqi 'hotfix\.css\|hotfix\.js' index.html app.js upgrade.js upgrade.css sw.js
          ! grep -RqiE '>[^<]*(demo|demonstration)[^<]*<' index.html admin/qr-kit.html legal/*.html

      - name: Commit materialized release branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git diff --cached --quiet && { echo "No production changes were generated."; exit 1; }
          git commit -m "Deploy Southernmost production release 20260726b"
          git push origin HEAD:deploy/production-polish-20260726b
