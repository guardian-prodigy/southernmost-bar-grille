name: QA Southernmost Platform v2

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: southernmost-platform-qa-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate source
        run: npm run check
      - name: Install browser driver
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts playwright-core@1.55.0
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$chrome"
          echo "CHROME_PATH=$chrome" >> "$GITHUB_ENV"
          "$chrome" --version
      - name: Start local production server
        shell: bash
        run: |
          set -euo pipefail
          nohup python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/southernmost-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/southernmost-server.log
          exit 1
      - name: Run complete platform journey tests
        shell: bash
        run: |
          set +e
          mkdir -p .qa /tmp/southernmost-platform-qa-v2
          cat > .qa/verify.mjs <<'NODE'
          import { chromium } from "playwright-core";
          import fs from "node:fs";

          const base = "http://127.0.0.1:4173";
          const release = "20260727b";
          const failures = [];
          const report = { phases: {}, failures };
          const expect = (condition, message) => { if (!condition) failures.push(message); };
          const save = () => fs.writeFileSync("/tmp/southernmost-platform-qa-v2/report.json", JSON.stringify(report, null, 2));
          let browser;

          async function open(context, path) {
            const page = await context.newPage();
            const errors = [];
            page.on("pageerror", error => errors.push(error.message));
            page.on("response", response => {
              if (response.url().startsWith(base) && response.status() >= 400) errors.push(`HTTP ${response.status()} ${response.url()}`);
            });
            await page.goto(`${base}${path}`, { waitUntil: "domcontentloaded", timeout: 120000 });
            await page.waitForSelector(`body[data-release="${release}"]`, { timeout: 30000 });
            await page.waitForTimeout(900);
            return { page, errors };
          }

          try {
            browser = await chromium.launch({ executablePath: process.env.CHROME_PATH, headless: true, args: ["--no-sandbox", "--disable-dev-shm-usage", "--disable-gpu"] });
            const desktop = await browser.newContext({ viewport: { width: 1440, height: 1000 }, serviceWorkers: "allow" });

            report.phases.routes = {};
            for (const route of ["/", "/menu/", "/events/", "/private-events/", "/visit/", "/loyalty/", "/staff/", "/admin/"]) {
              const { page, errors } = await open(desktop, route);
              const state = await page.evaluate(() => ({
                release: document.body.dataset.release,
                page: document.body.dataset.page,
                height: document.querySelector("#page-root")?.getBoundingClientRect().height || 0,
                overflow: document.documentElement.scrollWidth - innerWidth,
                title: document.title
              }));
              report.phases.routes[route] = { state, errors };
              expect(state.release === release, `${route}: wrong release`);
              expect(state.height > 250, `${route}: page did not render`);
              expect(state.overflow <= 1, `${route}: horizontal overflow ${state.overflow}px`);
              expect(state.title.includes("Southernmost"), `${route}: title missing`);
              expect(errors.length === 0, `${route}: ${errors.join(" | ")}`);
              await page.close();
            }

            {
              const { page, errors } = await open(desktop, "/");
              const state = await page.evaluate(() => ({
                tonight: document.querySelectorAll(".tonight-row").length,
                modes: document.querySelectorAll("[data-home-mode]").length,
                canvases: document.querySelectorAll("canvas").length,
                experiences: document.querySelectorAll(".experience").length,
                locked: document.body.classList.contains("no-scroll"),
                layerHidden: document.querySelector("#layer")?.hidden,
                guideClosed: document.querySelector("#guide-drawer")?.getAttribute("aria-hidden"),
                cartClosed: document.querySelector("#cart-drawer")?.getAttribute("aria-hidden")
              }));
              report.phases.home = { state, errors };
              expect(state.tonight >= 4 && state.modes === 4 && state.canvases >= 2 && state.experiences >= 3, `Home incomplete ${JSON.stringify(state)}`);
              expect(!state.locked && state.layerHidden && state.guideClosed === "true" && state.cartClosed === "true", `Home layer state wrong ${JSON.stringify(state)}`);
              await page.locator("[data-open-guide]").first().click();
              await page.waitForTimeout(250);
              expect(await page.locator("#guide-drawer").evaluate(el => el.classList.contains("open")), "Guide did not open");
              await page.locator("#guide-drawer [data-close-drawers]").click();
              await page.waitForTimeout(320);
              expect(!(await page.locator("body").evaluate(el => el.classList.contains("no-scroll"))), "Guide left scrolling locked");
              await page.locator("[data-open-cart]").first().click();
              await page.waitForTimeout(250);
              expect(await page.locator("#cart-drawer").evaluate(el => el.classList.contains("open")), "Cart did not open");
              await page.locator("#cart-drawer [data-close-drawers]").click();
              await page.waitForTimeout(320);
              expect(!(await page.locator("body").evaluate(el => el.classList.contains("no-scroll"))), "Cart left scrolling locked");
              await page.screenshot({ path: "/tmp/southernmost-platform-qa-v2/desktop-home.png" });
              await page.close();
            }

            {
              const { page, errors } = await open(desktop, "/events/");
              const state = await page.evaluate(() => ({ billiards: Boolean(document.querySelector("#billiards-canvas")), waitlist: document.querySelectorAll("[data-waitlist]").length, sports: document.querySelectorAll(".sport-row").length }));
              report.phases.events = { state, errors };
              expect(state.billiards && state.waitlist >= 1 && state.sports >= 3, `Events and billiards incomplete ${JSON.stringify(state)}`);
              await page.close();
            }

            {
              const { page, errors } = await open(desktop, "/menu/");
              const state = await page.evaluate(() => ({ cards: document.querySelectorAll(".menu-card").length, filters: document.querySelectorAll("#menu-filters .filter").length, images: document.querySelectorAll(".menu-card img").length, book: Boolean(document.querySelector("#menu-book")) }));
              report.phases.menu = { state, errors };
              expect(state.cards >= 50 && state.filters >= 10 && state.images >= 50 && state.book, `Menu incomplete ${JSON.stringify(state)}`);
              await page.locator("#menu-search").fill("mahi");
              await page.waitForTimeout(160);
              const visible = await page.locator(".menu-card:not([hidden])").count();
              expect(visible >= 1 && visible < state.cards, `Menu search failed (${visible})`);
              await page.locator("[data-book-next]").first().click();
              await page.waitForTimeout(720);
              expect(await page.locator(".sheet.turned").count() >= 1, "Desktop menu book did not advance");
              await page.close();
            }

            {
              const mobileContext = await browser.newContext({ viewport: { width: 412, height: 915 }, isMobile: true, hasTouch: true, deviceScaleFactor: 1, serviceWorkers: "allow" });
              const { page, errors } = await open(mobileContext, "/menu/");
              const initial = await page.evaluate(() => {
                const dock = document.querySelector(".mobile-dock"); const rect = dock.getBoundingClientRect();
                return { overflow: document.documentElement.scrollWidth-innerWidth, dock: { display:getComputedStyle(dock).display, position:getComputedStyle(dock).position, visible:rect.width>0&&rect.height>0&&rect.top<innerHeight&&rect.bottom>0 }, mobileBook:getComputedStyle(document.querySelector(".mobile-book")).display, desktopBook:getComputedStyle(document.querySelector(".book")).display, filterHeight:document.querySelector(".filter")?.getBoundingClientRect().height||0 };
              });
              report.phases.mobile = { initial, errors };
              expect(initial.overflow <= 1, `Mobile overflow ${initial.overflow}px`);
              expect(initial.dock.display !== "none" && initial.dock.position === "fixed" && initial.dock.visible, `Mobile dock wrong ${JSON.stringify(initial.dock)}`);
              expect(initial.mobileBook !== "none" && initial.desktopBook === "none", "Mobile book mode wrong");
              expect(initial.filterHeight >= 36, `Mobile filters too small ${initial.filterHeight}`);
              await page.evaluate(() => scrollTo(0, Math.min(2200, document.body.scrollHeight-innerHeight)));
              await page.waitForTimeout(350);
              const dockAfter = await page.locator(".mobile-dock").evaluate(el => { const r=el.getBoundingClientRect(); return {position:getComputedStyle(el).position,visible:r.top<innerHeight&&r.bottom>0}; });
              expect(dockAfter.position === "fixed" && dockAfter.visible, "Mobile dock disappeared after scroll");
              const before = await page.locator(".mobile-book h3").textContent();
              await page.locator("[data-book-next]").last().click();
              await page.waitForTimeout(720);
              const after = await page.locator(".mobile-book h3").textContent();
              expect(before !== after, `Mobile menu book failed ${before} -> ${after}`);
              await page.screenshot({ path: "/tmp/southernmost-platform-qa-v2/mobile-menu.png" });
              await mobileContext.close();
            }

            {
              const orderContext = await browser.newContext({ viewport: { width: 412, height: 915 }, isMobile: true, hasTouch: true, serviceWorkers: "allow" });
              await orderContext.addInitScript(() => localStorage.clear());
              const { page, errors } = await open(orderContext, "/order/?table=12&zone=dining&token=SM-DINING-12");
              await page.waitForSelector("#verify-form", { timeout: 20000 });
              await page.locator('input[name="firstName"]').fill("Alex");
              await page.locator('input[name="phone"]').fill("5615550188");
              await page.locator('input[name="ageConfirmed"]').check();
              await page.locator("#verify-form").evaluate(form => form.requestSubmit());
              await page.waitForSelector('[data-authorize="digital"]');
              await page.locator('[data-authorize="digital"]').click();
              await page.waitForSelector(".order-layout");
              const active = await page.evaluate(() => ({ context:document.querySelector("#order-context-pill")?.textContent||"", cards:document.querySelectorAll(".menu-card").length, members:document.querySelectorAll("[data-member]").length, services:document.querySelectorAll("[data-service]").length, session:window.SMStore.getState().session, layerHidden:document.querySelector("#layer")?.hidden, locked:document.body.classList.contains("no-scroll") }));
              report.phases.order = { active, errors };
              expect(/dining/i.test(active.context) && /12/.test(active.context), `Order QR context lost ${active.context}`);
              expect(active.cards >= 50 && active.members >= 1 && active.services >= 4 && active.session?.authorization, `Order session incomplete ${JSON.stringify(active)}`);
              expect(active.layerHidden && !active.locked, `Order loaded with an obstructing layer ${JSON.stringify(active)}`);

              const itemButton = page.locator("[data-item]:not([disabled])").nth(3);
              await itemButton.evaluate(el => el.scrollIntoView({ block: "center", inline: "nearest" }));
              await page.waitForTimeout(280);
              const hit = await itemButton.evaluate(el => {
                const rect = el.getBoundingClientRect();
                const top = document.elementFromPoint(rect.left + rect.width / 2, rect.top + rect.height / 2);
                return { clickable: top === el || el.contains(top), top: top ? `${top.tagName}.${top.className || ""}` : "none", rect: { top: rect.top, bottom: rect.bottom, left: rect.left, right: rect.right } };
              });
              report.phases.order.itemHitTarget = hit;
              expect(hit.clickable, `Order item hit target obstructed ${JSON.stringify(hit)}`);
              if (hit.clickable) await itemButton.tap();
              else await itemButton.evaluate(el => el.click());
              await page.waitForSelector("#item-form");
              await page.locator("#item-form").evaluate(form => form.requestSubmit());
              await page.waitForTimeout(260);
              expect((await page.evaluate(() => window.SMStore.getState().cart.length)) >= 1, "Order item did not enter cart");
              await page.locator("[data-submit-round]").click();
              await page.waitForTimeout(300);
              expect((await page.evaluate(() => window.SMStore.getState().rounds.length)) >= 1, "Order round did not submit");
              await page.locator("[data-service]").first().click();
              await page.waitForTimeout(200);
              expect((await page.evaluate(() => window.SMStore.getState().serviceRequests.length)) >= 1, "Service request did not record");
              await page.locator("[data-open-checkout]").click();
              await page.waitForTimeout(250);
              expect(await page.locator("#modal").evaluate(el => el.classList.contains("open")), "Split checkout did not open");
              await page.screenshot({ path: "/tmp/southernmost-platform-qa-v2/mobile-order.png" });
              await orderContext.close();
            }

            {
              const { page: staff, errors: staffErrors } = await open(desktop, "/staff/");
              const staffState = await staff.evaluate(() => ({ views:document.querySelectorAll("[data-staff-view]").length,tables:document.querySelectorAll(".table-tile").length,cards:document.querySelectorAll(".dash-card").length }));
              report.phases.staff = { staffState, staffErrors };
              expect(staffState.views >= 5 && staffState.tables >= 4 && staffState.cards >= 2, `Staff incomplete ${JSON.stringify(staffState)}`);
              await staff.locator('[data-staff-view="kitchen"]').click();
              await staff.waitForTimeout(160);
              expect(await staff.locator(".ticket").count() >= 1, "Kitchen queue missing");
              await staff.close();

              const { page: admin, errors: adminErrors } = await open(desktop, "/admin/");
              const adminState = await admin.evaluate(() => ({views:document.querySelectorAll("[data-admin-view]").length,cards:document.querySelectorAll(".dash-card").length}));
              report.phases.admin = { adminState, adminErrors };
              expect(adminState.views >= 5 && adminState.cards >= 2, `Admin incomplete ${JSON.stringify(adminState)}`);
              await admin.locator('[data-admin-view="menu"]').click();
              await admin.waitForTimeout(160);
              expect(await admin.locator("[data-admin-item-row]").count() >= 50, "Admin menu CMS missing");
              await admin.close();
            }

            {
              const { page } = await open(desktop, "/");
              const worker = await page.evaluate(async () => {
                const registration = await Promise.race([navigator.serviceWorker.ready,new Promise((_,reject)=>setTimeout(()=>reject(new Error("service worker timeout")),15000))]);
                return {state:registration.active?.state||null,caches:await caches.keys()};
              });
              report.phases.serviceWorker = worker;
              expect(worker.state === "activated", `Service worker not activated ${JSON.stringify(worker)}`);
              expect(worker.caches.includes("southernmost-v18-20260727b"), `Release cache missing ${JSON.stringify(worker)}`);
              await page.close();
            }

            await desktop.close();
          } catch (error) {
            failures.push(`Unhandled QA exception: ${error.stack || error}`);
          } finally {
            if (browser) await browser.close().catch(()=>{});
            save();
            console.log(JSON.stringify(report, null, 2));
            if (failures.length) process.exitCode = 1;
          }
          NODE
          node .qa/verify.mjs > /tmp/southernmost-platform-qa-v2/run.log 2>&1
          status=$?
          cat /tmp/southernmost-platform-qa-v2/run.log
          exit $status
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: southernmost-platform-v5-qa-v2
          path: /tmp/southernmost-platform-qa-v2
          if-no-files-found: error
          retention-days: 5
